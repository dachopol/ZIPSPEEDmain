name: ZIPSPEED quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zipspeed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --check web/src/app.mjs && node --check web/src/measurement.mjs && node --check runtime-check.mjs && node --check release-check.mjs && node --check play-console-check.mjs && node --check privacy-url-check.mjs && node --check browser-check.mjs
      - run: npm run check
  web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run runtime:check
      - uses: actions/upload-artifact@v4
        with: { name: zipspeed-web-runtime, path: runtime-artifacts/, if-no-files-found: error, retention-days: 14 }
  real-network-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: ZIPSPEED_REAL_NETWORK_SMOKE=1 npm run runtime:check
      - uses: actions/upload-artifact@v4
        with: { name: zipspeed-real-network-smoke, path: runtime-artifacts/, if-no-files-found: error, retention-days: 14 }
  browser-interaction:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: google-chrome --version || google-chrome-stable --version || chromium --version
      - run: npm run browser:check
      - uses: actions/upload-artifact@v4
        with: { name: zipspeed-browser-interaction, path: browser-artifacts/, if-no-files-found: error, retention-days: 14 }
  privacy-url-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run privacy:check
  release-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        with: { name: zipspeed-release-evidence, path: release-evidence/, if-no-files-found: error, retention-days: 14 }
  play-console-test-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run play:check
      - uses: actions/upload-artifact@v4
        with: { name: zipspeed-play-console-evidence, path: play-console-evidence/, if-no-files-found: error, retention-days: 14 }
  android-emulator-runtime:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run Android emulator interaction test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zipspeed-android-emulator-reports
          path: app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - run: gradle :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify debug APK identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          EXPECTED_CODE="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).zipspeed.versionCode")"
          EXPECTED_PACKAGE="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).zipspeed.packageId")"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n1)"
          test -n "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK" | head -n1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='$EXPECTED_PACKAGE'"* ]] || { echo "::error::APK package mismatch"; exit 1; }
          [[ "$BADGING" == *"versionCode='$EXPECTED_CODE'"* ]] || { echo "::error::APK versionCode mismatch"; exit 1; }
          [[ "$BADGING" == *"versionName='$EXPECTED_VERSION'"* ]] || { echo "::error::APK versionName mismatch"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: zipspeed-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error, retention-days: 14 }
  android-release-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - run: gradle :app:zipspeedSigningStatus :app:bundleRelease --stacktrace
      - name: Record release bundle evidence
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "::error::Release AAB missing"; exit 1; }
          mkdir -p release-bundle-evidence
          cp "$AAB" release-bundle-evidence/app-release.aab
          sha256sum "$AAB" > release-bundle-evidence/app-release.aab.sha256
          gradle :app:zipspeedSigningStatus --quiet > release-bundle-evidence/signing-status.txt
          cat release-bundle-evidence/signing-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zipspeed-release-bundle
          path: release-bundle-evidence/
          if-no-files-found: error
          retention-days: 14
