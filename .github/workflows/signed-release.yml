name: ZIPSPEED signed release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZIPSPEED_KEYSTORE_BASE64: ${{ secrets.ZIPSPEED_KEYSTORE_BASE64 }}
      ZIPSPEED_KEYSTORE_PASSWORD: ${{ secrets.ZIPSPEED_KEYSTORE_PASSWORD }}
      ZIPSPEED_KEY_ALIAS: ${{ secrets.ZIPSPEED_KEY_ALIAS }}
      ZIPSPEED_KEY_PASSWORD: ${{ secrets.ZIPSPEED_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZIPSPEED_KEYSTORE_BASE64" || { echo "::error::ZIPSPEED_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ZIPSPEED_KEYSTORE_PASSWORD" || { echo "::error::ZIPSPEED_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ZIPSPEED_KEY_ALIAS" || { echo "::error::ZIPSPEED_KEY_ALIAS is missing"; exit 1; }
          test -n "$ZIPSPEED_KEY_PASSWORD" || { echo "::error::ZIPSPEED_KEY_PASSWORD is missing"; exit 1; }

      - name: Materialize upload keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          printf '%s' "$ZIPSPEED_KEYSTORE_BASE64" | base64 --decode > .signing/zipspeed-upload.jks
          chmod 600 .signing/zipspeed-upload.jks
          test -s .signing/zipspeed-upload.jks || { echo "::error::Decoded keystore is empty"; exit 1; }
          echo "ZIPSPEED_KEYSTORE_FILE=$GITHUB_WORKSPACE/.signing/zipspeed-upload.jks" >> "$GITHUB_ENV"

      - name: Validate keystore and alias
        shell: bash
        run: |
          set -euo pipefail
          keytool -list             -keystore "$ZIPSPEED_KEYSTORE_FILE"             -storepass "$ZIPSPEED_KEYSTORE_PASSWORD"             -alias "$ZIPSPEED_KEY_ALIAS" > /dev/null

      - name: Build signed release AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:zipspeedSigningStatus --quiet | tee signing-status.txt
          grep -q '^ZIPSPEED_RELEASE_SIGNING=READY$' signing-status.txt
          gradle :app:bundleRelease --stacktrace

      - name: Verify signed bundle and record evidence
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "::error::Signed release AAB missing"; exit 1; }
          jarsigner -verify "$AAB" > jarsigner-verify.txt
          grep -q 'jar verified.' jarsigner-verify.txt || { cat jarsigner-verify.txt; echo "::error::AAB signature verification failed"; exit 1; }
          mkdir -p signed-release-evidence
          cp "$AAB" signed-release-evidence/app-release.aab
          sha256sum "$AAB" > signed-release-evidence/app-release.aab.sha256
          cp signing-status.txt signed-release-evidence/signing-status.txt
          keytool -list -v             -keystore "$ZIPSPEED_KEYSTORE_FILE"             -storepass "$ZIPSPEED_KEYSTORE_PASSWORD"             -alias "$ZIPSPEED_KEY_ALIAS"             | grep 'SHA256:'             > signed-release-evidence/upload-certificate-sha256.txt
          test -s signed-release-evidence/upload-certificate-sha256.txt || { echo "::error::Upload certificate SHA-256 missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: zipspeed-signed-release
          path: signed-release-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Remove materialized keystore
        if: always()
        shell: bash
        run: rm -rf .signing
